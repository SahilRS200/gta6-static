# Owner-run check that the X (Twitter) secrets work. Manual trigger only (Actions tab → "Check X access" →
# Run workflow, or `npm run x:check` / `npm run x:check:write`). By default it only reads: signs in with the
# four secrets and confirms they act as @gamerinfo_in (about $0.01). Ticking "write test" also posts a test
# post and deletes it straight away (about $0.02), the only definitive proof that posting works.
name: Check X access

on:
  workflow_dispatch:
    inputs:
      write_test:
        description: 'Write test: post a test post and delete it straight away (about $0.02)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check X access
        run: node tools/check-x-access.mjs
        env:
          X_WRITE_TEST: ${{ inputs.write_test }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
